<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · SkillBridge'">SkillBridge</title>
  
  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 Grid & Utilities + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Master Design System -->
  <link rel="stylesheet" th:href="@{/css/skillbridge.css}">
</head>
<body>

<!-- Global Navbar -->
<nav th:fragment="nav(active)" class="sb-navbar">
  <div class="container container-wide">
    <div class="d-flex align-items-center justify-content-between w-100">
      
      <!-- Wordmark -->
      <a class="navbar-brand" th:href="@{/}">
        <i class="bi bi-intersect"></i>
        <span>SkillBridge</span>
      </a>

      <!-- Navigation Links -->
      <div class="d-flex align-items-center gap-1 gap-md-2">
        <th:block sec:authorize="isAuthenticated()">
          <a class="sb-nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''" th:href="@{/dashboard}">
            Dashboard
          </a>
          <a class="sb-nav-link" th:classappend="${active == 'projects'} ? 'active' : ''" th:href="@{/projects}">
            Projects
          </a>
          <a class="sb-nav-link" th:classappend="${active == 'post'} ? 'active' : ''" th:href="@{/projects/new}">
            Post role
          </a>
          <a class="sb-nav-link" th:classappend="${active == 'profile'} ? 'active' : ''" th:href="@{/profile}">
            Profile
          </a>
          
          <form th:action="@{/logout}" method="post" class="d-inline ms-2">
            <button class="btn btn-sb-secondary btn-sm-compact" type="submit">
              Sign out
            </button>
          </form>
        </th:block>

        <th:block sec:authorize="!isAuthenticated()">
          <a class="sb-nav-link" th:classappend="${active == 'login'} ? 'active' : ''" th:href="@{/login}">
            Sign in
          </a>
          <a class="btn btn-sb-primary btn-sm-compact ms-2" th:href="@{/register}">
            Get started
          </a>
        </th:block>
      </div>

    </div>
  </div>
</nav>

<!-- Clean Footer -->
<footer th:fragment="footer" class="sb-footer">
  <div class="container container-wide">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
      <div>
        <span>SkillBridge</span> &bull; <span>Student team formation &amp; skill matching</span>
      </div>
      <div>
        <span>Java &amp; DBMS Mini Project</span> &bull; <span>Spring Boot &amp; MySQL 8</span>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
